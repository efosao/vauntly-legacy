table:
  schema: public
  name: posts
insert_permissions:
  - role: user
    permission:
      check:
        created_by_user_id:
          _eq: X-Hasura-User-Id
      set:
        state: PENDING
        created_by_user_id: x-hasura-User-Id
      columns:
        - company_name
        - data_source
        - description
        - details_metadata
        - location
        - metadata
        - thumbnail
        - title
      backend_only: false
select_permissions:
  - role: public
    permission:
      columns:
        - company_name
        - created_at
        - description
        - details_metadata
        - id
        - location
        - metadata
        - post_source
        - published_at
        - state
        - thumbnail
        - title
        - updated_at
      filter: {}
      limit: 50
  - role: user
    permission:
      columns:
        - id
        - details_metadata
        - metadata
        - company_name
        - data_source
        - description
        - external_id
        - location
        - post_source
        - state
        - thumbnail
        - title
        - created_at
        - published_at
        - updated_at
        - created_by_user_id
      filter:
        _or:
          - created_by_user_id:
              _eq: X-Hasura-User-Id
          - created_by_user_id:
              _is_null: true
update_permissions:
  - role: user
    permission:
      columns:
        - company_name
        - description
        - details_metadata
        - location
        - metadata
        - thumbnail
        - title
        - updated_at
      filter:
        created_by_user_id:
          _eq: X-Hasura-User-Id
      check: null
