table:
  schema: public
  name: user
array_relationships:
  - name: jobs
    using:
      foreign_key_constraint_on:
        column: posted_by
        table:
          schema: public
          name: job
  - name: jobsByUpdatedBy
    using:
      foreign_key_constraint_on:
        column: updated_by
        table:
          schema: public
          name: job
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - auth_id
        - first_name
        - last_name
        - email
        - created_on
        - updated_on
        - deleted_on
      filter:
        id:
          _eq: X-Hasura-User-Id
      allow_aggregations: true
